<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Magnitude Run</title>
  <!-- Full-bleed ink so the maskable crop never shows a transparent corner.
       The crystal is the in-game shard (rocky.js drawCrystal) scaled x190 and
       kept inside the central 80% safe circle: flat facets, pearl seams. -->
  <rect width="512" height="512" fill="#161616"/>
  <!-- stomp ring on the ground line -->
  <ellipse cx="256" cy="436.5" rx="88" ry="13" fill="none" stroke="#F3E7EC" stroke-opacity="0.22" stroke-width="3"/>
  <!-- facets: top-left, top-right, lower-left, body -->
  <polygon points="256,75.5 151.5,189.5 237,218" fill="#A17A8F"/>
  <polygon points="256,75.5 237,218 360.5,189.5" fill="#825A6D"/>
  <polygon points="151.5,189.5 237,218 183.8,436.5" fill="#6A475A"/>
  <polygon points="237,218 360.5,189.5 328.2,436.5 183.8,436.5" fill="#523542"/>
  <!-- pearl seams between facets -->
  <polyline points="256,75.5 237,218 183.8,436.5" fill="none" stroke="#F3E7EC" stroke-opacity="0.35" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="237" y1="218" x2="360.5" y2="189.5" stroke="#F3E7EC" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <!-- the core: the one thing the Watchers cannot see into -->
  <rect x="208.5" y="294" width="95" height="22.8" fill="#F3E7EC" fill-opacity="0.9"/>
</svg>
